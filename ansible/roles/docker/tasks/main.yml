---
- name: Install Docker and Compose plugin
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
