---
- name: Create project directory
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    mode: "0755"

- name: Copy docker stack and scripts
  ansible.posix.synchronize:
    src: "{{ item }}"
    dest: /opt/homelab/
  loop:
    - "{{ playbook_dir }}/../docker"
    - "{{ playbook_dir }}/../scripts"

- name: Make backup script executable
  ansible.builtin.file:
    path: /opt/homelab/scripts/backup.sh
    mode: "0750"

- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: /opt/homelab/docker
    state: present
