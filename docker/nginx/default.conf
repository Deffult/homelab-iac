server {
  listen 80;
  server_name _;

  location /grafana/ { proxy_pass http://grafana:3000/; proxy_set_header Host $host; }
  location /git/     { proxy_pass http://gitea:3000/;   proxy_set_header Host $host; }
  location /         { proxy_pass http://vaultwarden:80; proxy_set_header Host $host; }
}
